services:
  - type: web
    name: mohi-results
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mohi-results-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: mohi-results-db
    plan: free
